<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Horizon Drive — 3D Racing</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="loading">
    <div class="loader-content">
      <h1>HORIZON DRIVE</h1>
      <div class="spinner"></div>
      <p>Building world…</p>
    </div>
  </div>

  <div id="hud" class="hidden">
    <div class="hud-top">
      <div class="lap-info">
        <span class="label">LAP</span>
        <span id="lap">1 / 3</span>
      </div>
      <div class="checkpoint-info">
        <span class="label">CHECKPOINT</span>
        <span id="checkpoint">0 / 0</span>
      </div>
      <div class="time-info">
        <span class="label">TIME</span>
        <span id="time">00:00.00</span>
      </div>
    </div>

    <div class="hud-bottom">
      <div class="speedo">
        <svg viewBox="0 0 200 200" class="gauge">
          <defs>
            <linearGradient id="gaugeGrad" x1="0" y1="0" x2="1" y2="0">
              <stop offset="0%" stop-color="#00e5ff"/>
              <stop offset="60%" stop-color="#ffeb3b"/>
              <stop offset="100%" stop-color="#ff1744"/>
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="90" fill="rgba(0,0,0,0.55)" stroke="#00e5ff" stroke-width="2"/>
          <path id="gaugeArc" d="" fill="none" stroke="url(#gaugeGrad)" stroke-width="10" stroke-linecap="round"/>
          <line id="needle" x1="100" y1="100" x2="100" y2="30" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
          <circle cx="100" cy="100" r="8" fill="#00e5ff"/>
        </svg>
        <div class="speed-text">
          <span id="speed">0</span>
          <span class="unit">KM/H</span>
        </div>
        <div class="gear" id="gear">D</div>
      </div>
    </div>

    <div class="hud-controls">
      <p><strong>W/↑</strong> Throttle &nbsp;·&nbsp; <strong>S/↓</strong> Brake &nbsp;·&nbsp; <strong>A/←</strong> <strong>D/→</strong> Steer &nbsp;·&nbsp; <strong>SPACE</strong> Handbrake &nbsp;·&nbsp; <strong>C</strong> Camera &nbsp;·&nbsp; <strong>R</strong> Reset</p>
    </div>

    <div id="finish" class="hidden">
      <h2>FINISH!</h2>
      <p>Your time: <span id="finalTime"></span></p>
      <p>Best time: <span id="bestTime"></span></p>
      <button id="restartBtn">Race Again</button>
    </div>
  </div>

  <canvas id="game"></canvas>

  <!-- Three.js via CDN -->
  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.161.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.161.0/examples/jsm/"
    }
  }
  </script>
  <script type="module" src="game.js"></script>
</body>
</html>
